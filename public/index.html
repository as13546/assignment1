<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Assignment 1 · Coding agent workbench</title>
<link rel="stylesheet" href="/style.css">
<script>
  try {
    const t = localStorage.getItem('agent-view-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="8" fill="url(#mark)"/>
        <path d="M9.2 18.6 14 9.2l4.8 9.4" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="14" cy="20.4" r="1.35" fill="#fff"/>
        <defs>
          <linearGradient id="mark" x1="1" y1="0" x2="27" y2="28" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0A84FF"/><stop offset="1" stop-color="#5E5CE6"/>
          </linearGradient>
        </defs>
      </svg>
    </span>
  </div>

  <div class="topbar-controls">
    <label class="toggle" title="Fold counting-only events (thinking tokens, hook plumbing) into a counter instead of listing each one.">
      <input id="noise" type="checkbox" checked>
      <span class="switch" aria-hidden="true"></span>
      <span class="toggle-label">Chatter</span>
    </label>

    <div class="theme" role="group" aria-label="Appearance">
      <button type="button" data-theme-choice="auto" aria-pressed="true">Auto</button>
      <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
    </div>

    <button id="clear" class="ghost" type="button" title="Forget the runs on this page (the agent is untouched)">Clear</button>

    <span id="conn" class="conn" data-state="connecting" title="WebSocket to the server">Connecting…</span>
  </div>
</header>

<main class="layout">

  <aside id="conversations-rail" class="rail rail-conversations" aria-label="Conversations">
    <div class="rail-head">
      <span>Conversations</span>
    </div>
    <div id="sessions" class="sessions">
      <div id="sessions-permission" class="sessions-permission">
        <p id="sessions-permission-text">Allow this page to read recent Claude Code session files from your computer?</p>
        <button id="grant-sessions" class="primary" type="button">Allow</button>
      </div>
      <div id="sessions-list-wrap" hidden>
        <p id="sessions-empty" class="rail-empty">No recent sessions found.</p>
        <ul id="sessions-list" class="sessions-list"></ul>
      </div>
      <button id="revoke-sessions" class="ghost sessions-revoke" type="button" hidden>Stop sharing</button>
    </div>
  </aside>

  <section class="stage">
    <section id="trajectory" class="trajectory">
      <div id="empty-state" class="empty-state">
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3.5c.5 3.9 1.6 5 5.5 5.5-3.9.5-5 1.6-5.5 5.5-.5-3.9-1.6-5-5.5-5.5 3.9-.5 5-1.6 5.5-5.5Z" fill="currentColor"/>
            <path d="M18 14.5c.25 1.95.8 2.5 2.75 2.75-1.95.25-2.5.8-2.75 2.75-.25-1.95-.8-2.5-2.75-2.75 1.95-.25 2.5-.8 2.75-2.75Z" fill="currentColor" opacity=".7"/>
          </svg>
        </div>
        <h1>Open a conversation<br>from the sidebar.</h1>
      </div>
    </section>
  </section>

</main>

<script type="module" src="/app.js"></script>
</body>
</html>
